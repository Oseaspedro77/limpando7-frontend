<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpando7 — Acesso</title>
    <link rel="stylesheet" href="login.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="./icons/nexus-icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Nexus Gestiora">
</head>

<body>

    <main class="login-page">

        <div id="nexusSplash" class="nexus-splash">
    <img
        src="./icons/nexus-icon-512.png"
        alt="Nexus Gestiora"
    >

    <h1>NEXUS GESTIORA</h1>
</div>

        <section class="login-card">

            <img src="./icons/nexus-icon-512.png" alt="Nexus Gestiora" class="nexus-logo">

            <h1>NEXUS GESTIORA</h1>
            <p>Acesso ao Dashboard</p>

            <form id="loginForm">

                <label for="username">Utilizador</label>
                <input type="text" id="username" autocomplete="username" required>

                <label for="password">Palavra-passe</label>
                <input type="password" id="password" autocomplete="current-password" required>

                <button type="submit">
                    Entrar
                </button>

                <p id="loginError" class="login-error"></p>

            </form>

        </section>

    </main>

    <script src="./login.js"></script>

</body>

</html>
